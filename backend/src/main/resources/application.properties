# ==========================================================
# OfficeFlow - Spring Boot Configuration for SSMS (Microsoft SQL Server)
# ==========================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=officeflow-backend

# Context Path for REST APIs
server.servlet.context-path=/

# ==========================================================
# Microsoft SQL Server / SSMS Connection Settings
# ==========================================================
# Standard SQL Server on port 1433:
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=officeflow_db;encrypt=true;trustServerCertificate=true

# Alternative: For SQL Server Express instance, uncomment below:
# spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=officeflow_db;encrypt=true;trustServerCertificate=true

# Alternative: For Windows Integrated Authentication, uncomment below:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=officeflow_db;integratedSecurity=true;encrypt=true;trustServerCertificate=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrong@Password

# ==========================================================
# JPA / Hibernate ORM Settings for SQL Server
# ==========================================================
# 'update': creates/updates tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ==========================================================
# Open-In-View and Jackson JSON formatting
# ==========================================================
spring.jpa.open-in-view=true
spring.jackson.serialization.indent_output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
